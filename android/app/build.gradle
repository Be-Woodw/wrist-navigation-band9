plugins { id 'com.android.application' }

// Opt-in Band 9 identity; Java navigation/notification code stays untouched.
def band9Target = project.hasProperty('band9')
android {
    namespace 'io.github.mi9pro.navigation'
    compileSdk 35
    defaultConfig {
        applicationId band9Target ? 'com.bewoodw.band9.navigation' : 'io.github.mi9pro.navigation'
        minSdk 26
        targetSdk 35
        versionCode band9Target ? 10 : 6
        versionName band9Target ? '0.3.0' : '0.2.1'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        sharedDebug {
            storeFile rootProject.file(band9Target ? '../signing/band9/development.p12' : '../signing/development.p12')
            storePassword 'android'
            keyAlias band9Target ? 'band9-navigation' : 'wrist-navigation'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }
    buildTypes {
        // Explicit compile-only path: never fall back to another debug identity.
        debug { signingConfig project.hasProperty('unsigned') ? null : signingConfigs.sharedDebug }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/xms-wearable-lib_1.4_release.aar')
    implementation 'androidx.annotation:annotation:1.8.2'
    testImplementation 'junit:junit:4.13.2'
}
